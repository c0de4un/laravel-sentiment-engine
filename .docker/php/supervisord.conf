[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F -O
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# ИСПРАВЛЕНО: Убрана директива user=www-data
# Мастер-процесс FPM должен работать от root, он сам понизит права для воркеров
priority=10

[program:laravel-mailers-worker]
command=php /var/www/html/artisan queue:work --queue=mailers --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=20

[program:laravel-default-worker]
command=php /var/www/html/artisan queue:work --queue=default --sleep=5 --tries=3 --max-time=7200
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
priority=20